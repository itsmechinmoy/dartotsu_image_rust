name: Prebuilt binaries

on:
  push:
    branches: [ci/prebuilt]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, files: libdartotsu_image_rust.so }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, files: libdartotsu_image_rust.so }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, files: dartotsu_image_rust.dll }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, files: dartotsu_image_rust.dll }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, files: "libdartotsu_image_rust.dylib libdartotsu_image_rust.a" }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, files: "libdartotsu_image_rust.dylib libdartotsu_image_rust.a" }
          - { name: ios-arm64, os: macos-latest, target: aarch64-apple-ios, files: libdartotsu_image_rust.a }
          - { name: ios-sim-arm64, os: macos-latest, target: aarch64-apple-ios-sim, files: libdartotsu_image_rust.a }
          - { name: ios-sim-x64, os: macos-latest, target: x86_64-apple-ios, files: libdartotsu_image_rust.a }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          for f in ${{ matrix.files }}; do
            cp "rust/target/${{ matrix.target }}/release/$f" out/
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../jniLibs build --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: jniLibs/**

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p zips
          for d in artifacts/*; do
            (cd "$d" && zip -qr "../../zips/$(basename "$d").zip" .)
          done
          ls -la zips
          gh release delete prebuilt --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create prebuilt zips/*.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Prebuilt binaries" \
            --notes "Temporary prebuilt binaries for ${GITHUB_SHA::7}. Not for production."
