[package]
name = "dartotsu_image_rust"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
fast_image_resize = { version = "5.1", features = ["rayon"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
